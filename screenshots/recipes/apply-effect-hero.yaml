# yaml-language-server: $schema=../node_modules/shotlist/dist/recipe.schema.json
#
# The Apply effect box with a custom bundle staged part by part, the way the tracking
# page's walkthrough tells it: two conditions, a reminder, a hidden counter, a penalty
# with its label, and the bundle name. Nothing is filled by a preset — the form is the
# feature, and the parts belong to a homebrew effect (Undertow) rather than a shipped
# one.
name: apply-effect-hero
install: site
# Tall enough that the whole box fits without scrolling inside itself: the bundle name
# at the bottom is the part 1.0 added, and a clip of a scrolled modal cuts it off.
viewport: { width: 1800, height: 1700 }

setup:
  - use: fight-board
  - click: { text: Ogre }
  - wait: 250
  - click: { role: button, name: Apply effect }
  - wait: 400
  # The form arrives with the Ogre's own Prone already selected — the board's state
  # is the form's starting point — so only Frightened is picked here.
  - click:
      css: button
      text: Frightened
      within: { panel: Apply effect to Ogre }
  - fill: { label: Custom reminder }
    value: Can't take reactions
  - click: { role: button, name: Add counter }
  - wait: 200
  - fill: { label: Counter 1 name }
    value: Depth
  - check: { role: checkbox, name: Hidden from players }
  - click: { role: button, name: Add a bonus or penalty }
  - wait: 200
  - select: { label: Modifier effect }
    optionLabel: Bonus / penalty
  - select: { label: Applies to }
    optionLabel: HP maximum
  - fill: { label: Amount }
    value: '-30'
  - fill: { label: Modifier label }
    value: Undertow
  - fill: { label: Bundle name }
    value: Undertow
  - wait: 300

clip: { panel: Apply effect to Ogre, pad: 14 }
